<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickLab — Audio QA</title>
<style>body{margin:32px auto;padding:0 20px;max-width:1000px;background:#151c21;color:#dce4e8;font:16px system-ui}button{background:#29383f;color:#e3efea;border:1px solid #52646d;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer}section{border-top:1px solid #34444d;padding:18px 0}label{display:block;margin:12px 0}input[type=range]{width:300px;accent-color:#87d5ac}#status{white-space:pre-wrap;background:#202a31;padding:16px;font:13px monospace}header{display:flex;justify-content:space-between}.note{color:#aebdc5}a{color:#9bdfbd}</style>
<header><h1>Audio QA</h1><div id="settings"></div></header><p class="note">Оригинальный звуковой набор BrickLab. Нажмите «Включить аудио» для разблокировки браузера. QA использует фактический production import map; здесь нет физики и WebGL.</p><button id="unlock">Включить аудио</button><button id="stop">Остановить все слои</button><a href="./index.html">В конструктор</a>
<section><h2>Интерфейс</h2><div id="ui"></div></section><section><h2>Сборка и соединения</h2><div id="build"></div></section><section><h2>Столкновения</h2><label>Сила удара · эквивалент Δv <output id="strengthLabel">0.4 m/s</output><br><input id="strength" type="range" min="0" max="2" step=".01" value=".4"></label><button id="impact">Удар</button><button data-sound="metal">Metal accent</button><button data-sound="suspension">Suspension</button></section>
<section><h2>Механика и музыка</h2><label>RPM <output id="rpmLabel">120</output><br><input id="rpm" type="range" min="0" max="800" value="120"></label><label>Нагрузка <input id="load" type="range" min="0" max="1" step=".01" value=".2"></label><div id="loops"></div><label>Положение источника слева / справа <input id="position" type="range" min="-20" max="20" value="0"></label></section><pre id="status" aria-live="polite">Audio locked</pre>
<script src="./tests/production-importmap-loader.js?v=1" data-module="./audio/qa.js"></script></html>
