services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bricklab
      POSTGRES_USER: bricklab_admin
      POSTGRES_PASSWORD: "${BRICKLAB_DB_PASSWORD:?Set BRICKLAB_DB_PASSWORD in .env}"
    volumes:
      - bricklab-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bricklab_admin -d bricklab"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    image: postgres:16
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: bricklab
      PGUSER: bricklab_admin
      PGPASSWORD: "${BRICKLAB_DB_PASSWORD:?Set BRICKLAB_DB_PASSWORD in .env}"
      PGCONNECT_TIMEOUT: 10
      BRICKLAB_APP_PASSWORD: "${BRICKLAB_APP_PASSWORD:?Set BRICKLAB_APP_PASSWORD in .env}"
    volumes:
      - ./server/db:/migrations:ro
    entrypoint: ["/bin/sh", "/migrations/setup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  bricklab:
    build: .
    volumes:
      - /var/lib/bricklab-catalog/public:/app/catalog/resolver:ro
      - /var/lib/bricklab-legal:/app/assets/legal:ro
      - /var/lib/bricklab-instructions-private:/app/private-instructions:ro
      - /var/lib/bricklab-commerce-private:/app/private-commerce:ro
    ports:
      - "${BRICKLAB_BIND:-127.0.0.1}:${BRICKLAB_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: bricklab
      PGUSER: bricklab_app
      PGPASSWORD: "${BRICKLAB_APP_PASSWORD:?Set BRICKLAB_APP_PASSWORD in .env}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      BRICKLAB_TRUSTED_PROXY_IP: "${BRICKLAB_TRUSTED_PROXY_IP:-}"
      BRICKLAB_REGISTRATION_ENABLED: "${BRICKLAB_REGISTRATION_ENABLED:-false}"
      BRICKLAB_COMMUNITY_ENABLED: "${BRICKLAB_COMMUNITY_ENABLED:-false}"
      BRICKLAB_REBRICKABLE_API_KEY: "${BRICKLAB_REBRICKABLE_API_KEY:-}"
      BRICKLAB_INSTRUCTIONS_RELEASE: "${BRICKLAB_INSTRUCTIONS_RELEASE:-false}"
      BRICKLAB_PRIVATE_INSTRUCTION_AUDIT: "${BRICKLAB_PRIVATE_INSTRUCTION_AUDIT:-}"
      BRICKLAB_INSTRUCTIONS_PROXY: "${BRICKLAB_INSTRUCTIONS_PROXY:-}"
      BRICKLAB_MAIL_USER: "${BRICKLAB_MAIL_USER:-}"
      BRICKLAB_MAIL_KEY: "${BRICKLAB_MAIL_KEY:-}"
      BRICKLAB_MAIL_FROM: "${BRICKLAB_MAIL_FROM:-}"
      BRICKLAB_COMMERCE_FULL_CATALOG_OFFER_VERSION: "${BRICKLAB_COMMERCE_FULL_CATALOG_OFFER_VERSION:-}"
      BRICKLAB_COMMERCE_MODE: "${BRICKLAB_COMMERCE_MODE:-test}"
      BRICKLAB_COMMERCE_APPROVAL_FILE: "${BRICKLAB_COMMERCE_APPROVAL_FILE:-}"
      BRICKLAB_YOOKASSA_LIVE_ENABLED: "${BRICKLAB_YOOKASSA_LIVE_ENABLED:-false}"
      BRICKLAB_YOOKASSA_LIVE_SHOP_ID: "${BRICKLAB_YOOKASSA_LIVE_SHOP_ID:-}"
      BRICKLAB_YOOKASSA_LIVE_SECRET: "${BRICKLAB_YOOKASSA_LIVE_SECRET:-}"
      BRICKLAB_NPD_RECEIPTS_READY: "${BRICKLAB_NPD_RECEIPTS_READY:-false}"
      BRICKLAB_HUB_KEY_FILE: "${BRICKLAB_HUB_KEY_FILE:-}"
      BRICKLAB_COMMERCE_TELEGRAM_ENABLED: "${BRICKLAB_COMMERCE_TELEGRAM_ENABLED:-false}"
      BRICKLAB_COMMERCE_TELEGRAM_TOKEN: "${BRICKLAB_COMMERCE_TELEGRAM_TOKEN:-}"
      BRICKLAB_COMMERCE_TELEGRAM_CHAT_ID: "${BRICKLAB_COMMERCE_TELEGRAM_CHAT_ID:-}"
      BRICKLAB_YOOKASSA_TEST_ENABLED: "${BRICKLAB_YOOKASSA_TEST_ENABLED:-false}"
      BRICKLAB_YOOKASSA_TEST_SHOP_ID: "${BRICKLAB_YOOKASSA_TEST_SHOP_ID:-}"
      BRICKLAB_YOOKASSA_TEST_SECRET: "${BRICKLAB_YOOKASSA_TEST_SECRET:-}"
      BRICKLAB_PAYMENTS_ENABLED: "${BRICKLAB_PAYMENTS_ENABLED:-}"
      BRICKLAB_ROBOKASSA_TEST: "${BRICKLAB_ROBOKASSA_TEST:-}"
      BRICKLAB_ROBOKASSA_LOGIN: "${BRICKLAB_ROBOKASSA_LOGIN:-}"
      BRICKLAB_ROBOKASSA_HASH: "${BRICKLAB_ROBOKASSA_HASH:-}"
      BRICKLAB_ROBOKASSA_TEST_PASSWORD1: "${BRICKLAB_ROBOKASSA_TEST_PASSWORD1:-}"
      BRICKLAB_ROBOKASSA_TEST_PASSWORD2: "${BRICKLAB_ROBOKASSA_TEST_PASSWORD2:-}"
      BRICKLAB_ROBOKASSA_PASSWORD1: "${BRICKLAB_ROBOKASSA_PASSWORD1:-}"
      BRICKLAB_ROBOKASSA_PASSWORD2: "${BRICKLAB_ROBOKASSA_PASSWORD2:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
volumes:
  bricklab-db:
