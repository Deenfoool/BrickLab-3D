name: BrickLab CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: bricklab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram worker syntax and security regression tests
        run: |
          node --check scripts/miniapp.js
          python3 -m py_compile scripts/bricklab-control.py scripts/bricklab-control-snapshot.py scripts/bricklab-control-actions.py scripts/bricklab-control-recovery.py scripts/bricklab-control-miniapp.py scripts/bricklab-control-external.py
          bash -n scripts/install-bricklab-control.sh
          bash -n scripts/bricklab-control-release.sh
          bash -n scripts/bricklab-control-approve.sh
          bash -n scripts/bricklab-control-verify-backup.sh
          bash -n scripts/install-bricklab-external.sh
          python3 -B tests/telegram_events_test.py
          python3 -B tests/telegram_control_test.py
          python3 -B tests/telegram_control_actions_test.py
          python3 -B tests/telegram_control_automation_test.py
          python3 -B tests/telegram_control_recovery_test.py
          python3 -B tests/telegram_control_miniapp_test.py
          python3 -B tests/telegram_control_release_test.py
          python3 -B tests/telegram_control_external_test.py
          python3 -B tests/telegram_control_maintenance_test.py
          python3 -B tests/telegram_control_issue_test.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricklab
          POSTGRES_USER: bricklab_admin
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bricklab_admin -d bricklab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: bricklab
      PGUSER: bricklab_admin
      PGPASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if needed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply migrations
        run: sh server/db/migrate.sh
      - name: Verify migration is idempotent
        run: sh server/db/migrate.sh
      - name: Verify database constraints and revision history
        run: psql -X -v ON_ERROR_STOP=1 -f server/db/test-schema.sql
      - name: Provision restricted application role
        env:
          BRICKLAB_APP_PASSWORD: ci-only-runtime-password
        run: sh server/db/provision-app.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test authentication with PostgreSQL
        env:
          PGUSER: bricklab_app
          PGPASSWORD: ci-only-runtime-password
          BRICKLAB_TEST_DB: 'true'
        run: node --test tests/server-auth.test.js
      - name: Verify runtime cannot access project tables
        env:
          PGUSER: bricklab_app
          PGPASSWORD: ci-only-runtime-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM bricklab.sessions LIMIT 1'
          if psql -X -v ON_ERROR_STOP=1 -c 'SELECT * FROM bricklab.projects'; then
            echo "Runtime role has unexpected access to projects"
            exit 1
          fi
      - name: Reject changed applied migration
        run: |
          printf '\\n-- modified after application\\n' >> server/db/migrations/001_initial.sql
          if sh server/db/migrate.sh; then
            echo "Changed migration was accepted"
            exit 1
          fi
