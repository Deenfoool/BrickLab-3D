name: BrickLab CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: bricklab-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 imagemagick
      - name: Install locked dependencies
        run: npm ci --include=dev --ignore-scripts
      - name: Run regression tests
        env:
          BRICKLAB_TEST_IMAGE: 'true'
        run: npm test -- --test-concurrency=1

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bricklab_browser_test
          POSTGRES_USER: bricklab_admin
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U bricklab_admin -d bricklab_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: bricklab_browser_test
      PGUSER: bricklab_admin
      PGPASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client if needed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Apply migrations
        run: sh server/db/migrate.sh
      - name: Verify migration is idempotent
        run: sh server/db/migrate.sh
      - name: Verify database constraints and revision history
        run: psql -X -v ON_ERROR_STOP=1 -f server/db/test-schema.sql
      - name: Provision restricted application role
        env:
          BRICKLAB_APP_PASSWORD: ci-only-runtime-password
        run: sh server/db/provision-app.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev --ignore-scripts
      - name: Test authentication with PostgreSQL
        env:
          PGUSER: bricklab_app
          PGPASSWORD: ci-only-runtime-password
          BRICKLAB_TEST_DB: 'true'
        run: node --test tests/server-auth.test.js
      - name: Verify private project isolation (RLS)
        run: psql -X -v ON_ERROR_STOP=1 -f server/db/test-project-access.sql
      - name: Verify account security and administrator permissions
        run: psql -X -v ON_ERROR_STOP=1 -f server/db/tests/account_security.sql
      - name: Reject changed applied migration
        run: |
          printf '\n-- modified after application\n' >> server/db/migrations/001_initial.sql
          if sh server/db/migrate.sh; then
            echo "Changed migration was accepted"
            exit 1
          fi
