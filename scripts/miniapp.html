<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrickLab Control Center</title><link rel="stylesheet" href="app.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="app.js"></script></head><body><header><div class="eyebrow">BRICKLAB / CONTROL CENTER</div><h1>Панель управления</h1><p id="status" role="status">Проверяем доступ…</p><button id="refresh" type="button">Обновить</button></header><main id="dashboard" hidden><section><h2>Сервер</h2><div class="tiles" id="server"></div></section><section><h2>Сообщество</h2><div class="tiles" id="stats"></div><h3>Последние 7 дней</h3><div id="chart"></div></section><section><h2>Эксплуатация</h2><div class="tiles" id="ops"></div></section><section id="moderation"><h2>Модерация</h2><p id="admin-status" role="status">Нужна активная сессия администратора BrickLab.</p><div class="admin-controls"><button type="button" data-admin="users">Пользователи</button><button type="button" data-admin="build-reports">Жалобы на сборки</button><button type="button" data-admin="reports">Жалобы на комментарии</button><button type="button" data-admin="bugs">Баг-репорты</button></div><label for="admin-query">Поиск аккаунта / ID отчёта</label><input id="admin-query" maxlength="100" autocomplete="off"><div id="admin-list"></div><button id="admin-more" type="button" hidden>Следующая страница</button><form id="admin-confirm" hidden><h3 id="admin-action-label"></h3><label for="admin-reason">Причина действия (обязательно)</label><textarea id="admin-reason" required maxlength="500" rows="3"></textarea><div class="admin-controls"><button type="submit">Подтвердить действие</button><button type="button" id="admin-cancel">Отмена</button></div></form></section><nav><a href="https://bricklab-3d.ru/#account/admin/overview">Администрирование</a><a href="https://github.com/Deenfoool/BrickLab-3D/actions">GitHub CI</a></nav></main><footer>Метрики: только просмотр · модерация: отдельная авторизация BrickLab</footer></body></html>
